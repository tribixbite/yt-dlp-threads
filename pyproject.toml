[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-dlp-threads"
version = "0.2.0"
description = "yt-dlp extractor plugin for Threads (threads.com / threads.net)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
authors = [{ name = "tribixbite" }]
keywords = ["yt-dlp", "yt-dlp-plugin", "threads", "instagram", "downloader", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = ["yt-dlp"]

[project.urls]
Homepage = "https://github.com/tribixbite/yt-dlp-threads"
Issues = "https://github.com/tribixbite/yt-dlp-threads/issues"

# yt_dlp_plugins is a PEP 420 implicit namespace package (no __init__.py).
[tool.setuptools.packages.find]
include = ["yt_dlp_plugins*"]
namespaces = true

# Rules are listed explicitly: ruff's default rule set changes between
# releases (0.17 started flagging RUF/FURB rules that 0.15 did not), which
# turned the weekly CI run red with no code change. CI also pins ruff.
[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF", "FURB", "SLF"]

[tool.ruff.lint.per-file-ignores]
# Tests drive the extractor through its private hooks on purpose.
"tests/*" = ["SLF001"]
